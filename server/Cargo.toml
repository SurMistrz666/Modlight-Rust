[package]
name = "modlight-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Rust port of the Modlight server (self-hosted file and screenshot host)"
publish = false
default-run = "modlight-server"

[lib]
name = "modlight_server"
path = "src/lib.rs"

[[bin]]
name = "modlight-server"
path = "src/main.rs"

[dependencies]
# HTTP stack (PORT.md section 4)
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "catch-panic", "trace"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "service", "client-legacy"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
multer = "3"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }

# Data and encoding
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
form_urlencoded = "1"
percent-encoding = "2"
regex = "1"

# Crypto (PORT.md section 4: the auth agent builds password hashing, 2FA and
# verification tokens on these; pinned here so every branch agrees on versions)
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
subtle = "2"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
bcrypt = "0.17"
chacha20poly1305 = "0.10"
jsonwebtoken = "9"
# Auth port: lib/secret-box.ts (AES-256-GCM over an HKDF key), Better Auth's
# NFKC password normalisation, lib/mail.ts (nodemailer -> lettre, rustls).
aes-gcm = "0.10"
sha1 = "0.10"
hkdf = "0.12"
unicode-normalization = "0.1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
# Optional Cloudflare Turnstile (src/turnstile.rs): the siteverify call over
# HTTPS, rustls with ring and the Mozilla roots like the mail transport. Both
# crates are already in the graph (aws-smithy-http-client).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# S3 storage (lib/storage/s3.ts, lib-storage's Upload, @tus/s3-store): the
# official AWS SDK, as upstream uses @aws-sdk/client-s3. HTTPS through rustls
# with ring, the provider the rest of the crate already uses, instead of the
# SDK's default aws-lc build.
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-ring"] }

# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Deflate and inflate: album ZIPs (app/a/[userCode]/[slug]/zip, archiver 8,
# with CRC-32), the PDF writer (pdf-lib's Flate streams, media/pdf_lib.rs),
# lib/media/zip-guard.ts (node:zlib) and the .docx reader (JSZip's pako). The
# zlib-rs backend is a port of zlib itself, so streams are accepted, refused
# and expanded exactly as zlib (Node) and pako (zlib 1.2.8 ported) do;
# miniz_oxide differs on malformed Huffman tables.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"

# Misc
dotenvy = "0.15"
# statfs(2) for lib/upload/disk.ts (`fs.statfs` upstream); already in the lock graph.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# A bare HTTP client for fetching presigned URLs in the S3 tests.
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
# Dependencies are rebuilt rarely and run a lot (sqlx, crypto): optimise them.
[profile.dev.package."*"]
opt-level = 2
