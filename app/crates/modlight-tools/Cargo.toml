[package]
name = "modlight-tools"
description = "The ShareX tools of Modlight App without windows: colours, QR codes, the directory indexer, the image combiner, the video converter's arguments, metadata, OCR and AI requests, the history views' logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modlight-core.workspace = true
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
image.workspace = true
log.workspace = true
regex = "1"
base64.workspace = true
# Analyze image: the providers' HTTP requests.
reqwest.workspace = true
tokio.workspace = true
# QR codes and the other ZXing formats (a Rust port of ZXing).
rxing = { version = "=0.9.3", default-features = false, features = ["encoding_rs", "encoders", "decoders", "full_barcode_format_support", "multi_barcode_readers"] }

[dev-dependencies]
tempfile.workspace = true
