[package]
name = "modlight-core"
description = "Modlight App without windows: texts, formats, skins, settings and their sync, the account, the library's logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modlight-api.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
log.workspace = true
rand.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
url.workspace = true
notify.workspace = true
image.workspace = true
regex = "1"
# Phase 3, media: component downloads, archives, child processes.
reqwest.workspace = true
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
libc = "0.2"
# Phase 5, the background remover's model (`background_removal`).
anyhow.workspace = true
ort.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(not(windows))'.dependencies]
# The personal folder (`~/Library/Application Support/Modlight`).
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml", "copy-dylibs"] }
# Windows: job objects for child processes, free disk space, file identity, the
# shell's known folders, environment strings, the computer's and the user's names.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
roxmltree.workspace = true
serde_json.workspace = true
