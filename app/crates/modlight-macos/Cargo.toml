[package]
name = "modlight-macos"
description = "macOS glue for Modlight App: Keychain through /usr/bin/security, opening links, system preferences, the windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modlight-core.workspace = true
hex.workspace = true
log.workspace = true
libc = "0.2"

[dependencies.image]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSData", "NSString", "NSEnumerator", "NSFileManager", "NSURL", "NSError", "NSDictionary", "NSValue", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSSound", "NSEvent", "NSWorkspace", "NSPasteboard", "NSImage", "NSCursor", "NSGraphics", "libc", "NSPasteboardItem", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFString", "CFNumber", "CFData", "CFCGTypes"] }
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
dispatch2 = "0.3"
global-hotkey = "0.9"
