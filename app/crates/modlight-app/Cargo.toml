[package]
name = "modlight-app"
description = "Modlight App for macOS: the window, My space, sign-in, notifications and the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Modlight"
path = "src/main.rs"

[lib]
name = "modlight_app"
path = "src/lib.rs"

[dependencies]
modlight-api.workspace = true
modlight-core.workspace = true
modlight-macos.workspace = true
modlight-editor.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
image.workspace = true
eframe.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
arboard.workspace = true
rfd.workspace = true
dirs.workspace = true
log.workspace = true
url.workspace = true
tray-icon = "0.21"

[dev-dependencies]
tempfile.workspace = true
