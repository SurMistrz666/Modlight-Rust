[package]
name = "modlight-app"
description = "Modlight App for macOS and Windows: the window, My space, sign-in, notifications and the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Modlight"
path = "src/main.rs"

[lib]
name = "modlight_app"
path = "src/lib.rs"

[dependencies]
modlight-api.workspace = true
modlight-core.workspace = true
modlight-editor.workspace = true
modlight-tools.workspace = true
modlight-effects.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
image.workspace = true
eframe.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
arboard.workspace = true
rfd.workspace = true
dirs.workspace = true
log.workspace = true
url.workspace = true
tray-icon = "0.21"

# The system's glue; `crate::platform` names the one this build uses.
[target.'cfg(not(windows))'.dependencies]
modlight-macos.workspace = true

[target.'cfg(windows)'.dependencies]
modlight-windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
