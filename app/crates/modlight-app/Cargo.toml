[package]
name = "modlight-app"
description = "Modlight App for macOS and Windows: the window, My space, sign-in, notifications and the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Modlight"
path = "src/main.rs"

[lib]
name = "modlight_app"
path = "src/lib.rs"

[dependencies]
modlight-api.workspace = true
modlight-core.workspace = true
modlight-editor.workspace = true
modlight-tools.workspace = true
modlight-effects.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
image.workspace = true
eframe.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
arboard.workspace = true
rfd.workspace = true
dirs.workspace = true
log.workspace = true
url.workspace = true
tray-icon = "0.21"

# The system's glue; `crate::platform` names the one this build uses.
[target.'cfg(not(windows))'.dependencies]
modlight-macos.workspace = true

[target.'cfg(windows)'.dependencies]
modlight-windows.workspace = true
# What the window itself asks of Windows: its parent's console (`--qa-shot`), the
# taskbar button's progress (`TaskbarManager`), the update installer, the double-click
# time of the tray icon, ShareX's mutex. The `windows` crate for the COM taskbar list.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# Windows: Modlight.exe's icon, version information and manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true

# The snapshot test compares a Windows render with the shared picture without writing.
[target.'cfg(windows)'.dev-dependencies]
dify = { version = "0.8", default-features = false }
