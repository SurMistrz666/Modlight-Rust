[workspace]
members = [
    "crates/modlight-api",
    "crates/modlight-core",
    "crates/modlight-macos",
    "crates/modlight-app",
]
resolver = "3"

[workspace.package]
version = "0.7.7"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
modlight-api = { path = "crates/modlight-api" }
modlight-core = { path = "crates/modlight-core" }
modlight-macos = { path = "crates/modlight-macos" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
futures-util = "0.3"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp", "tiff"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2" }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
arboard = "3.6"
rfd = "=0.17.2"
dirs = "6"
tempfile = "3"
roxmltree = "0.20"
log = "0.4"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
